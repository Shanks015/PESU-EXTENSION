<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document viewer</title>
  <style>
    :root {
      --bg: #191a1c;
      --bg-top: #1c1d20;
      --bar: #212226;
      --bar-line: #34363b;
      --button: #2a2c31;
      --button-hover: #33353b;
      --page: #f7f7f4;
      --ink: #e7e6e1;
      --muted: #9a9c9e;
      --faint: #6f7174;
      --accent: #d3a963;
      --accent-dim: #6b5733;
      --danger: #cf7a6b;
      --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
      --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 58px 12px 56px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.5;
      background: linear-gradient(180deg, var(--bg-top), var(--bg) 220px);
      -webkit-font-smoothing: antialiased;
    }

    /* ───────────────────────── top bar ───────────────────────── */

    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 46px;
      padding: 0 14px;
      background: var(--bar);
      border-bottom: 1px solid var(--bar-line);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      animation: bar-in 0.22s ease-out both;
    }

    @keyframes bar-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bar-left {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
      color: #d6d4cd;
    }

    .bar-icon {
      width: 15px;
      height: 15px;
      color: var(--accent);
      flex: 0 0 auto;
    }

    .bar-title {
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .bar-rule {
      width: 1px;
      height: 18px;
      background: var(--bar-line);
      flex: 0 0 auto;
    }

    .bar-status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
      color: var(--muted);
      font-size: 12.5px;
    }

    .bar-status #status {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.005em;
    }

    .dot {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7fa886;
      transition: background 0.25s ease;
    }

    body.busy .dot {
      background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .counter {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      user-select: none;
      white-space: nowrap;
    }

    .zoom {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--bar-line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--button);
    }

    .zoom button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #c9c8c2;
      font-family: var(--sans);
      font-size: 12px;
      line-height: 1;
      padding: 6px 8px;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .zoom button + button { border-left: 1px solid var(--bar-line); }

    .zoom button:hover { background: var(--button-hover); color: #fff; }

    .zoom button.zoom-label {
      font-family: var(--mono);
      font-size: 10px;
      min-width: 42px;
      color: var(--muted);
    }

    .btn {
      appearance: none;
      border: 1px solid var(--accent-dim);
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      font-family: var(--sans);
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .btn:hover { background: rgba(211, 169, 99, 0.12); color: #f0d3a2; }
    .btn:active { transform: translateY(1px); }
    .btn[hidden] { display: none !important; }
    .btn:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
      background: transparent;
      color: var(--accent);
    }

    .btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #1b1a17;
    }


    /* ───────────────────────── download menu ───────────────────────── */

    .download { position: relative; flex: 0 0 auto; }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .download-btn svg {
      width: 8px;
      height: 5px;
      opacity: 0.7;
    }

    .menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      min-width: 232px;
      padding: 4px;
      background: var(--bar);
      border: 1px solid var(--bar-line);
      border-radius: 6px;
      box-shadow: 0 14px 28px -18px rgba(0, 0, 0, 0.95);
    }

    .menu[hidden] { display: none; }

    .menu-note {
      margin: 2px 3px 5px;
      padding: 7px 8px;
      border-radius: 4px;
      background: rgba(211, 169, 99, 0.1);
      color: #d8c79f;
      font-size: 11px;
      line-height: 1.45;
      white-space: normal;
    }

    .menu-note[hidden] { display: none; }

    .menu button {
      appearance: none;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 12.5px;
      text-align: left;
      padding: 7px 9px;
      cursor: pointer;
      white-space: nowrap;
    }

    .menu button span {
      color: var(--muted);
      font-size: 11px;
    }

    .menu button:hover,
    .menu button:focus-visible {
      background: var(--button);
      color: #fff;
      outline: none;
    }

    .bar-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      overflow: hidden;
      background: transparent;
      transition: opacity 0.5s ease 0.3s;
    }

    .bar-progress > span {
      display: block;
      height: 100%;
      width: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      background: var(--accent);
      transition: transform 0.35s ease;
    }

    .bar.done .bar-progress { opacity: 0; }

    /* ───────────────────────── loading card ───────────────────────── */

    .boot {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(14, 15, 16, 0.78);
      transition: opacity 0.32s ease, visibility 0.32s ease;
    }

    .boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }

    .boot-card {
      width: min(340px, calc(100vw - 40px));
      padding: 26px 24px 22px;
      text-align: center;
      background: #202126;
      border: 1px solid #33353a;
      border-radius: 10px;
      box-shadow: 0 26px 60px -34px rgba(0, 0, 0, 0.95);
      animation: card-in 0.3s ease-out both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .boot-spinner {
      width: 18px;
      height: 18px;
      margin: 2px auto 15px;
      border: 2px solid #3a3c42;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .boot-alert {
      display: none;
      width: 26px;
      height: 26px;
      margin: 0 auto 15px;
      place-items: center;
      border: 1px solid rgba(207, 122, 107, 0.5);
      border-radius: 50%;
      color: var(--danger);
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1;
    }

    .boot.error .boot-spinner { display: none; }
    .boot.error .boot-alert { display: grid; }
    .boot.error .boot-bar { display: none; }
    .boot.error .boot-hint {
      margin-top: 18px;
      font-family: var(--sans);
      font-size: 11.5px;
      letter-spacing: 0;
    }

    .boot h1 {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #ecebe6;
    }

    .boot-sub {
      margin: 0 auto;
      max-width: 30ch;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--muted);
    }

    .boot-bar {
      position: relative;
      height: 2px;
      margin: 20px 0 14px;
      border-radius: 2px;
      overflow: hidden;
      background: #2d2f34;
    }

    .boot-bar > span {
      position: absolute;
      inset: 0;
      width: 38%;
      background: var(--accent);
      animation: sweep 1.5s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }

    .boot-hint {
      margin: 0;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.02em;
      color: var(--faint);
    }

    /* ───────────────────────── pages ───────────────────────── */

    #pages {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      width: 100%;
    }

    .page-wrapper {
      position: relative;
      flex: 0 0 auto;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 2px;
      background: var(--page);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.045),
        0 2px 5px rgba(0, 0, 0, 0.35),
        0 18px 34px -24px rgba(0, 0, 0, 0.85);
    }

    .page-canvas {
      display: block;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.35s ease;
    }

    .page-wrapper.painted .page-canvas { opacity: 1; }

    .page-chip {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 30;
      padding: 2px 5px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.05em;
      color: #6d6b63;
      background: rgba(252, 251, 247, 0.85);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
      user-select: none;
    }

    .page-wrapper:hover .page-chip { opacity: 1; }

    .skeleton {
      position: absolute;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      background: #faf9f6;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, 0.75) 50%, transparent 65%);
      transform: translateX(-100%);
      animation: sheen 1.6s ease-in-out infinite;
    }

    .skeleton.stalled::after { display: none; }
    .skeleton.stalled { background: #f1efe9; }

    @keyframes sheen {
      to { transform: translateX(100%); }
    }

    .ghost {
      position: absolute;
      height: 6px;
      border-radius: 3px;
      background: #eceae4;
    }

    .ghost:first-child {
      height: 10px;
      background: #e2dfd7;
    }

    /* ───────────────────────── selectable text ───────────────────────── */

    .text-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      line-height: 1;
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .ocr-line {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .ocr-line::selection { background: rgba(211, 169, 99, 0.42); }

    /* ───────────────────────── fallback ───────────────────────── */

    .fallback-note {
      padding: 8px 12px;
      border: 1px solid rgba(207, 122, 107, 0.28);
      border-radius: 5px;
      background: rgba(207, 122, 107, 0.08);
      color: #d99a8e;
      font-size: 12px;
    }

    .fallback-frame {
      width: 100%;
      height: calc(100vh - 150px);
      border: 0;
      border-radius: 2px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* ───────────────────────── narrow screens ───────────────────────── */

    @media (max-width: 720px) {
      .bar-title, .bar-rule, .counter { display: none; }
      .bar { gap: 10px; padding: 0 10px; }
      body { padding-left: 8px; padding-right: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
  <script src="pdf.min.js"></script>
  <script src="tesseract.min.js"></script>
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-spinner" aria-hidden="true"></div>
      <div class="boot-alert" aria-hidden="true">!</div>
      <h1 id="bootTitle">Opening document</h1>
      <p class="boot-sub" id="bootSub">Fetching the file…</p>
      <div class="boot-bar" aria-hidden="true"><span></span></div>
      <p class="boot-hint" id="bootHint">Recognition runs on this machine</p>
    </div>
  </div>

  <header id="dock" class="bar" hidden>
    <div class="bar-left">
      <svg class="bar-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M4 1.8h5l3.2 3.2v9.2H4z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
        <path d="M9 1.8v3.2h3.2" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
      </svg>
      <span class="bar-title">Slides</span>
    </div>
    <span class="bar-rule" aria-hidden="true"></span>
    <div class="bar-status">
      <span class="dot" aria-hidden="true"></span>
      <span id="status" role="status" aria-live="polite">Opening…</span>
    </div>
    <div class="bar-right">
      <span class="counter" id="counter" aria-label="Pages processed">--/--</span>
      <div class="zoom" role="group" aria-label="Zoom">
        <button data-zoom="out" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button class="zoom-label" data-zoom="reset" id="zoomLabel" title="Fit to width (0)" aria-label="Reset zoom">Fit</button>
        <button data-zoom="in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      </div>
      <button class="btn" id="openBtn" disabled title="Open this PDF in a new tab">Open</button>
      <div class="download">
        <button class="btn download-btn" id="downloadBtn" aria-haspopup="true" aria-expanded="false" aria-controls="downloadMenu" title="Save these slides as a file">
          Download
          <svg viewBox="0 0 8 5" aria-hidden="true">
            <path d="M1 1l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="menu" id="downloadMenu" role="menu" aria-label="Download format" hidden>
          <div class="menu-note" id="menuNote" hidden></div>
          <button type="button" role="menuitem" data-format="pdf">PDF <span>slides with selectable text</span></button>
          <button type="button" role="menuitem" data-format="docx">Word <span>text only, .docx</span></button>
          <button type="button" role="menuitem" data-format="pptx">PowerPoint <span>editable text, .pptx</span></button>
        </div>
      </div>
      <button class="btn" id="forceOcrBtn" hidden title="Read the slides with OCR instead">Try OCR</button>
    </div>
    <div class="bar-progress" aria-hidden="true"><span id="progressFill"></span></div>
  </header>

  <main id="pages"></main>

  <script src="naming.js"></script>
  <script src="exporter.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
